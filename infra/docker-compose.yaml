services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  postgres:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: toxicflow
      
  ingestor:
    build:
      context: ../ingestion
      args:
        VERSION: dev
    image: tofd/ingestor:dev
    container_name: tofd-ingestor
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      BROKER: kafka
      KAFKA_BROKERS: kafka:9092
      FEED_MODE: csv
      CSV_PATH: /data/sample_binance_trades.csv
      CSV_SPEED: "50"
      LOG_FORMAT: json
      STATS_EVERY: 15s
    volumes:
      - ../data:/data:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  processing:
    build:
      context: ../processing
    image: tofd/processing:dev
    container_name: tofd-processing
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: processing-group
      INPUT_TOPIC: trades.raw
      OUTPUT_TOPIC: trades.normalized
      NUM_WORKERS: "4"

  scorer:
    build:
      context: ../scoring
    image: tofd/scorer:dev
    container_name: tofd-scorer
    restart: unless-stopped
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: trades.normalized
      KAFKA_ALERTS_TOPIC: trades.alerts
      KAFKA_GROUP_ID: tofd-scorer
      KAFKA_AUTO_OFFSET_RESET: earliest
      PG_DSN: postgresql://postgres:devpassword@postgres:5432/toxicflow
      SCORER_EWMA_ALPHA: "0.1"
      SCORER_MIN_TRADES: "10"
      SCORER_DEFAULT_THRESHOLD: "3.0"
      SCORER_THRESHOLD_BTCUSDT: "3.0"
      SCORER_THRESHOLD_ETHUSDT: "3.0"
      SCORER_THRESHOLD_DOGEUSDT: "2.5"
      SCORER_CHECKPOINT_EVERY: "100"

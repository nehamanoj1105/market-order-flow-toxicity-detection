<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOFD — Market Toxicity</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>

<body>
<header class="topbar">
    <div>
        <h1>TOFD</h1>
        <span>Market Order Flow Toxicity Detection</span>
    </div>

    <div class="connection">
        <span id="connection-dot"></span>
        <span id="connection-status">CONNECTING</span>
    </div>
</header>

<main>
    <section class="live-section">
        <div class="section-heading">
            <h2>Live Toxicity</h2>
            <span id="alert-count">0 alerts</span>
        </div>

        <div id="live-alerts" class="alert-list">
            <div class="empty-state">
                Waiting for toxicity alerts...
            </div>
        </div>
    </section>

    <section class="history-section">
        <div class="section-heading">
            <h2>Alert History</h2>
            <button id="refresh-history">Refresh</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Symbol</th>
                        <th>Side</th>
                        <th>Z-Score</th>
                        <th>OFI</th>
                        <th>Price</th>
                        <th>Quantity</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <tr>
                        <td colspan="7" class="empty-state">
                            Loading history...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="/static/js/dashboard.js"></script>
</body>
</html>
